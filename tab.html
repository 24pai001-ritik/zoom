<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<style>
  :root { --brand: #7B19D8; --live: #e53935; --pause: #f2a900; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; user-select: none; }
  body { display: grid; place-items: center; }
  button {
    width: 52px; height: 52px; border-radius: 50%; border: 0; cursor: pointer; position: relative;
    background: var(--brand); color: #fff; font: 700 21px "Nirmala UI", "Segoe UI", sans-serif;
    box-shadow: 0 2px 8px rgba(0,0,0,.35); transition: transform .12s;
  }
  button:hover { transform: scale(1.06); }
  .dot { position: absolute; right: 3px; top: 3px; width: 12px; height: 12px; border-radius: 50%;
    border: 2px solid #fff; background: #9e9e9e; }
  body[data-s="live"] .dot { background: var(--live); animation: pulse 1.2s infinite; }
  body[data-s="paused"] .dot { background: var(--pause); }
  @keyframes pulse { 50% { opacity: .35; } }
</style>
</head>
<body data-s="idle">
  <button id="b" title="Hindi captions: click to start">हि<span class="dot"></span></button>
<script>
  const b = document.getElementById('b');
  const tips = { idle: 'Hindi captions: click to start', live: 'Listening. Click to show/hide the panel', paused: 'Paused. Click to show/hide the panel' };
  b.onclick = () => window.lhc.send('tab-click');
  window.lhc.on('state', ({ state }) => { document.body.dataset.s = state; b.title = tips[state]; });
</script>
</body>
</html>
